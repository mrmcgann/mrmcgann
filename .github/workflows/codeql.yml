name: Code scanning

# GitHub's CodeQL reads the code for security holes (injection, unsafe redirects, leaked data, and so on) on every
# pull request and once a week. Findings show under the repository's Security tab.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 19 * * 0"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
