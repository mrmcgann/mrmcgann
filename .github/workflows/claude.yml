name: Claude Code

# Claude Code fixes the problems sent from Admin → Site health (an issue that starts with @claude), and answers
# @claude in issues and pull requests. Only people with write access to this repository can start it.
#
# It reads and edits code and commits to its own claude/... branch through GitHub's API (signed commits); it can't
# run commands, so nothing it reads (like an error message from a visitor's browser) can make it run code. The tests
# run separately in ci.yml, and an admin puts a change live from the panel only once they pass.
#
# Setup (once): install the Claude GitHub app on this repository (https://github.com/apps/claude), add a repository
# secret ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`, for Pro and Max plans), and protect
# main (Settings → Rules → Rulesets: require a pull request and the "test" check).

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_commit_signing: true
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 80
            --disallowedTools Bash,WebFetch
